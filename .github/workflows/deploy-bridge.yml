      - name: Compare all deployment files with current main
        id: diff
        if: steps.manifest.outputs.skip == 'false'
        env:
          EXPECTED_APP_SHA: ${{ steps.manifest.outputs.appsha }}
          EXPECTED_BOOT_SHA: ${{ steps.manifest.outputs.bootsha }}
          EXPECTED_PKG_SHA: ${{ steps.manifest.outputs.pkgsha }}
        run: |
          set -euo pipefail

          current_sha() {
            if [ -f "$1" ]; then
              sha256sum "$1" | awk '{print $1}'
            else
              printf ''
            fi
          }

          CUR_APP="$(current_sha gobek17-app.zip)"
          CUR_BOOT="$(current_sha bootstrap.cjs)"
          CUR_PKG="$(current_sha package.json)"

          echo "Current app SHA:       ${CUR_APP:-missing}"
          echo "Published app SHA:     $EXPECTED_APP_SHA"
          echo "Current bootstrap SHA: ${CUR_BOOT:-missing}"
          echo "Published bootstrap:   $EXPECTED_BOOT_SHA"
          echo "Current package SHA:   ${CUR_PKG:-missing}"
          echo "Published package:     $EXPECTED_PKG_SHA"

          if [ "$CUR_APP" = "$EXPECTED_APP_SHA" ] \
            && [ "$CUR_BOOT" = "$EXPECTED_BOOT_SHA" ] \
            && [ "$CUR_PKG" = "$EXPECTED_PKG_SHA" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All three deployment files are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Deployment file difference detected."
          fi
