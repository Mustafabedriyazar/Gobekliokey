name: OKEY17 deploy bridge

# TEK SEFERLİK KURULUR, SONRA HİÇ DOKUNULMAZ.
# Akış: kanonik build artifact deposuna yayınlanır -> bu workflow SHA farkını görür
# -> main'e 3 dosyayı commit eder -> Railway autodeploy.
# PAT/secret yoktur. Actions'ın yerleşik GITHUB_TOKEN'ı kullanılır.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: okey17-deploy-bridge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu al
        uses: actions/checkout@v4

      - name: Yayın manifestini oku
        id: manifest
        env:
          BASE: ${{ vars.G17_ARTIFACT_BASE }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ]; then
            echo "G17_ARTIFACT_BASE tanımlı değil."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -fsSL "$BASE/manifest.json" -o /tmp/manifest.json; then
            echo "Manifest henüz erişilebilir değil; değişiklik yapılmıyor."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD="$(jq -r '.build // empty' /tmp/manifest.json)"
          APPSHA="$(jq -r '.app_zip_sha256 // empty' /tmp/manifest.json)"

          if [ -z "$BUILD" ] || ! echo "$APPSHA" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Manifest geçersiz; değişiklik yapılmıyor."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "appsha=$APPSHA" >> "$GITHUB_OUTPUT"

      - name: Mevcut main ile karşılaştır
        id: diff
        if: steps.manifest.outputs.ready == 'true'
        run: |
          set -euo pipefail

          CUR=""
          if [ -f gobek17-app.zip ]; then
            CUR="$(sha256sum gobek17-app.zip | cut -d' ' -f1)"
          fi

          echo "current=$CUR" >> "$GITHUB_OUTPUT"

          if [ "$CUR" = "${{ steps.manifest.outputs.appsha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Aynı build zaten main üzerinde."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Üç dosyayı indir ve SHA doğrula
        if: steps.diff.outputs.changed == 'true'
        env:
          BASE: ${{ vars.G17_ARTIFACT_BASE }}
        run: |
          set -euo pipefail

          curl -fsSL "$BASE/gobek17-app.zip" -o gobek17-app.zip
          curl -fsSL "$BASE/bootstrap.cjs" -o bootstrap.cjs
          curl -fsSL "$BASE/package.json" -o package.json

          GOT="$(sha256sum gobek17-app.zip | cut -d' ' -f1)"
          EXP="${{ steps.manifest.outputs.appsha }}"

          if [ "$GOT" != "$EXP" ]; then
            echo "SHA UYUŞMUYOR: beklenen $EXP, gelen $GOT"
            exit 1
          fi

          echo "SHA doğrulandı: $GOT"

      - name: Yalnız 3 dosyayı commit et
        if: steps.diff.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "okey17-deploy-bridge"
          git config user.email "deploy-bridge@users.noreply.github.com"

          git add -- bootstrap.cjs gobek17-app.zip package.json

          git diff --cached --quiet && exit 0

          git commit -m "Deploy OKEY17 ${{ steps.manifest.outputs.build }}"
          git push origin HEAD:main
