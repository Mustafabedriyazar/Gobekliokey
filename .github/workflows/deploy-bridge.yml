name: OKEY17 deploy bridge

# One-time setup.
# Flow:
# canonical artifact -> GitHub main -> Railway autodeploy
#
# No PAT or repository secret is required.
# The built-in GITHUB_TOKEN is used.
#
# The workflow checks all three deployment files:
# - bootstrap.cjs
# - gobek17-app.zip
# - package.json
#
# A deployment is triggered only when at least one of these files differs
# from the published artifact set.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: okey17-deploy-bridge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Read publish manifest
        id: manifest
        env:
          BASE: ${{ vars.G17_ARTIFACT_BASE }}
        run: |
          set -euo pipefail

          if [ -z "${BASE:-}" ]; then
            echo "G17_ARTIFACT_BASE is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -fsSL --retry 3 "$BASE/manifest.json" -o /tmp/manifest.json; then
            echo "Manifest is not available yet; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BUILD="$(jq -r '.build // empty' /tmp/manifest.json)"
          APPSHA="$(jq -r '.app_zip_sha256 // empty' /tmp/manifest.json)"
          BOOTSHA="$(jq -r '.bootstrap_cjs_sha256 // empty' /tmp/manifest.json)"
          PKGSHA="$(jq -r '.package_json_sha256 // empty' /tmp/manifest.json)"

          if [ -z "$BUILD" ]; then
            echo "Manifest build field is missing."
            exit 1
          fi

          if ! printf '%s' "$APPSHA" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Invalid app SHA-256 in manifest."
            exit 1
          fi

          if ! printf '%s' "$BOOTSHA" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Invalid bootstrap SHA-256 in manifest."
            exit 1
          fi

          if ! printf '%s' "$PKGSHA" | grep -Eq '^[0-9a-fA-F]{64}$'; then
            echo "Invalid package SHA-256 in manifest."
            exit 1
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "appsha=$APPSHA" >> "$GITHUB_OUTPUT"
          echo "bootsha=$BOOTSHA" >> "$GITHUB_OUTPUT"
          echo "pkgsha=$PKGSHA" >> "$GITHUB_OUTPUT"

      - name: Compare all deployment files with current main
        id: diff
        if: steps.manifest.outputs.skip == 'false'
        env:
          EXPECTED_APP_SHA: ${{ steps.manifest.outputs.appsha }}
          EXPECTED_BOOT_SHA: ${{ steps.manifest.outputs.bootsha }}
          EXPECTED_PKG_SHA: ${{ steps.manifest.outputs.pkgsha }}
        run: |
          set -euo pipefail

          current_sha() {
            if [ -f "$1" ]; then
              sha256sum "$1" | awk '{print $1}'
            else
              printf ''
            fi
          }

          CUR_APP="$(current_sha gobek17-app.zip)"
          CUR_BOOT="$(current_sha bootstrap.cjs)"
          CUR_PKG="$(current_sha package.json)"

          echo "Current app SHA:       ${CUR_APP:-missing}"
          echo "Published app SHA:     $EXPECTED_APP_SHA"

          echo "Current bootstrap SHA: ${CUR_BOOT:-missing}"
          echo "Published bootstrap:   $EXPECTED_BOOT_SHA"

          echo "Current package SHA:   ${CUR_PKG:-missing}"
          echo "Published package:     $EXPECTED_PKG_SHA"

          if [ "$CUR_APP" = "$EXPECTED_APP_SHA" ] \
            && [ "$CUR_BOOT" = "$EXPECTED_BOOT_SHA" ] \
            && [ "$CUR_PKG" = "$EXPECTED_PKG_SHA" ]; then

            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "All three deployment files are already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Deployment file difference detected."
          fi

      - name: Download deployment files
        if: steps.manifest.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          BASE: ${{ vars.G17_ARTIFACT_BASE }}
        run: |
          set -euo pipefail

          curl -fsSL --retry 3 "$BASE/bootstrap.cjs" \
            -o bootstrap.cjs

          curl -fsSL --retry 3 "$BASE/gobek17-app.zip" \
            -o gobek17-app.zip

          curl -fsSL --retry 3 "$BASE/package.json" \
            -o package.json

      - name: Verify SHA-256
        if: steps.manifest.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          EXPECTED_APP_SHA: ${{ steps.manifest.outputs.appsha }}
          EXPECTED_BOOT_SHA: ${{ steps.manifest.outputs.bootsha }}
          EXPECTED_PKG_SHA: ${{ steps.manifest.outputs.pkgsha }}
        run: |
          set -euo pipefail

          verify_file() {
            FILE="$1"
            EXPECTED="$2"
            GOT="$(sha256sum "$FILE" | awk '{print $1}')"

            if [ "$GOT" != "$EXPECTED" ]; then
              echo "SHA-256 MISMATCH"
              echo "File: $FILE"
              echo "Expected: $EXPECTED"
              echo "Received: $GOT"
              exit 1
            fi

            echo "SHA OK: $FILE"
          }

          verify_file \
            "bootstrap.cjs" \
            "$EXPECTED_BOOT_SHA"

          verify_file \
            "gobek17-app.zip" \
            "$EXPECTED_APP_SHA"

          verify_file \
            "package.json" \
            "$EXPECTED_PKG_SHA"

      - name: Commit only deployment files
        if: steps.manifest.outputs.skip == 'false' && steps.diff.outputs.changed == 'true'
        env:
          BUILD: ${{ steps.manifest.outputs.build }}
        run: |
          set -euo pipefail

          git config user.name \
            "okey17-deploy-bridge"

          git config user.email \
            "deploy-bridge@users.noreply.github.com"

          git add -- \
            bootstrap.cjs \
            gobek17-app.zip \
            package.json

          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi

          CHANGED="$(
            git diff --cached --name-only |
            sort
          )"

          EXPECTED="$(
            printf '%s\n' \
              bootstrap.cjs \
              gobek17-app.zip \
              package.json |
            sort
          )"

          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "Unexpected files are staged."
            echo "$CHANGED"
            exit 1
          fi

          git commit \
            -m "Deploy OKEY17 $BUILD"

          git push \
            origin HEAD:main

          echo "GitHub main updated successfully."
          echo "Railway autodeploy should start automatically."
