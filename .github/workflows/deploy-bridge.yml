name: OKEY17 deploy bridge

# One-time setup. After this file is installed, no manual GitHub or Railway work is required.
# Flow: canonical build artifacts are published to G17_ARTIFACT_BASE ->
#       this workflow detects the SHA-256 difference -> commits ONLY the three
#       deployment files to main -> Railway autodeploy -> health verification.
# No PAT and no repository secret: the built-in GITHUB_TOKEN is used.

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: okey17-deploy-bridge
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read publish manifest
        id: manifest
        env:
          BASE: ${{ vars.G17_ARTIFACT_BASE }}
        run: |
          set -euo pipefail
          if [ -z "${BASE:-}" ]; then
            echo "G17_ARTIFACT_BASE is not set; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! curl -fsSL --retry 2 "$BASE/manifest.json" -o /tmp/manifest.json; then
            echo "Manifest is not published yet; skipping quietly (job stays green)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "build=$(jq -r .build /tmp/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "appsha=$(jq -r .app_zip_sha256 /tmp/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "bootsha=$(jq -r .bootstrap_cjs_sha256 /tmp/manifest.json)" >> "$GITHUB_OUTPUT"
          echo "pkgsha=$(jq -r .package_json_sha256 /tmp/manifest.json)" >> "$GITHUB_OUTPUT"

      - name: Compare with current main
        id: diff
        if: steps.manifest.outputs.skip == 'false'
        run: |
          set -euo pipefail
          CUR=""
          if [ -f gobek17-app.zip ]; then
            CUR="$(sha256sum gobek17-app.zip | cut -d' ' -f1)"
          fi

          if [ "$CUR" = "${{ steps.manifest.outputs.appsha }}" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "main is already up to date: $CUR"
          else
            echo "changed=true" >> "$GITHUB
